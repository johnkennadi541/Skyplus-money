name: SKYPLUS MONEY - Release APK

# Manual only. Nothing here runs on push, so a source upload never builds an APK.
# Run it from the Actions tab once the keystore secrets and the
# RELEASE_CERT_SHA256 repository variable are in place.
#
# Secrets required: KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD
# Variable required: RELEASE_CERT_SHA256  (public certificate fingerprint)
# Every secret is passed through the step's env: block and referenced as "$NAME".
# No secret is ever written into the shell text with ${{ }} interpolation.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyplus-money-release-apk
  cancel-in-progress: false

jobs:
  release-apk:
    # Never expose signing secrets to a manually selected feature branch.
    if: github.ref == 'refs/heads/main'
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check that the signing secrets and the expected fingerprint exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_FINGERPRINT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "${STORE_PASSWORD:-}" ] || missing="$missing STORE_PASSWORD"
          [ -n "${KEY_PASSWORD:-}" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          if [ -z "${EXPECTED_FINGERPRINT:-}" ]; then
            echo "::error::Repository variable RELEASE_CERT_SHA256 is not set. Take the value from the one-time keystore run summary."
            exit 1
          fi
          NORMALISED=$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          if ! printf '%s' "$NORMALISED" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::RELEASE_CERT_SHA256 is not a valid SHA-256 fingerprint (64 hex characters expected). Refusing to build."
            exit 1
          fi
          echo "Secrets present and the expected fingerprint is a valid SHA-256."

      - name: Restore the release keystore from the secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          test -s my-upload-key.jks || { echo "::error::Restored keystore is empty - check KEYSTORE_BASE64"; exit 1; }
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload > /dev/null \
            || { echo "::error::Alias 'upload' is missing from the restored keystore"; exit 1; }
          echo "Keystore restored and alias 'upload' confirmed."

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK signature and certificate fingerprint
        env:
          EXPECTED_FINGERPRINT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Release APK was not produced at $APK"; exit 1; }

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found in the Android build-tools"; exit 1; }

          if ! CERTS=$("$APKSIGNER" verify --print-certs "$APK"); then
            echo "::error::APK signature verification failed"
            exit 1
          fi
          echo "$CERTS"

          EXPECTED=$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          if ! printf '%s' "$EXPECTED" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Expected fingerprint is missing or malformed. Refusing this APK."
            exit 1
          fi

          ACTUAL=$(printf '%s\n' "$CERTS" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          if ! printf '%s' "$ACTUAL" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Could not read a valid signing certificate SHA-256 from the APK. Refusing this APK."
            exit 1
          fi

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch. Expected $EXPECTED but the APK is signed by $ACTUAL. Refusing this APK."
            exit 1
          fi
          echo "Certificate matches the permanent release certificate: $ACTUAL"

          ls -l "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Remove the keystore from the runner
        if: always()
        run: |
          rm -f my-upload-key.jks
          if [ -f my-upload-key.jks ]; then
            echo "::error::The keystore is still present on the runner"
            exit 1
          fi
          echo "Keystore removed from the runner."

      - name: Upload the release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skyplus-money-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
