name: SKYPLUS MONEY - Release APK
# Manual only. Source pushes never build a release APK. Verifies the restored
# keystore certificate before Gradle and verifies the APK signature afterwards.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BUILD-RELEASE-APK to confirm a signed release build'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: skyplus-money-release-apk
  cancel-in-progress: false
jobs:
  release-apk:
    if: github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require confirmation
        env: { CONFIRMATION: ${{ inputs.confirmation }} }
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = "BUILD-RELEASE-APK" ] || { echo "::error::Confirmation mismatch"; exit 1; }
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Validate secrets and fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_FINGERPRINT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] || { echo "::error::Missing signing secret"; exit 1; }
          EXPECTED=$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          printf '%s' "$EXPECTED" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::Invalid RELEASE_CERT_SHA256"; exit 1; }
      - name: Restore and verify keystore certificate before build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          EXPECTED_FINGERPRINT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          test -s my-upload-key.jks
          DETAILS=$(keytool -list -v -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload)
          ACTUAL=$(printf '%s\n' "$DETAILS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::Restored keystore fingerprint mismatch"; exit 1; }
          echo "Restored keystore and alias match the configured certificate."
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature matches permanent certificate
        env: { EXPECTED_FINGERPRINT: ${{ vars.RELEASE_CERT_SHA256 }} }
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          [ -n "$APKSIGNER" ]
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          ACTUAL=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::APK certificate mismatch"; exit 1; }
          echo "APK signature matches permanent release certificate."
          sha256sum "$APK"
      - name: Remove keystore from runner
        if: always()
        run: |
          rm -f my-upload-key.jks
          test ! -e my-upload-key.jks
      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skyplus-money-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
