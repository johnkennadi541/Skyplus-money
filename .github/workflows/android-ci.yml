name: SKYPLUS MONEY Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # feature/ui-redesign is included so pull requests into the redesign branch get a
    # normal automatic CI run. The workflow that GitHub loads for a pull request comes
    # from the BASE branch, so this change must live on feature/ui-redesign itself.
    branches: [ main, develop, 'feature/ui-redesign' ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Robolectric 4.16.1 refuses to create a sandbox for SDK 36 on JDK 17:
      # "Android SDK 36 requires Java 21 (have Java 17)". The test JVM must be 21.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The debug signing config in app/build.gradle.kts points at ./debug.keystore.
      # That file is git-ignored, so the runner creates a throw-away one. It is only
      # used for local/CI debug builds and is never used to sign a distributed APK.
      - name: Create throw-away debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storetype JKS \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Debug Kotlin
        run: ./gradlew :app:compileDebugKotlin

      # Blocking gate: every unit and Robolectric test must pass.
      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest

      # Always print an exact count of what the suite actually executed, so the
      # result can be quoted without guessing.
      - name: Summarise test results
        if: always()
        run: |
          set -euo pipefail
          DIR=app/build/test-results/testDebugUnitTest
          if [ ! -d "$DIR" ]; then
            echo "::error::No test results directory at $DIR"
            exit 1
          fi
          echo "Test classes executed: $(find "$DIR" -name 'TEST-*.xml' | wc -l)"
          awk -F'"' '/<testsuite /{for(i=1;i<=NF;i++){if($i ~ /tests=$/){t+=$(i+1)} if($i ~ /failures=$/){f+=$(i+1)} if($i ~ /errors=$/){e+=$(i+1)} if($i ~ /skipped=$/){s+=$(i+1)}}} END{printf "tests=%d failures=%d errors=%d skipped=%d\n", t, f, e, s}' "$DIR"/TEST-*.xml

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Report APK details
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::Debug APK was not produced at $APK"; exit 1; }
          ls -l "$APK"
          sha256sum "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" | grep -E "^package:|^application-label:" | head -3
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skyplus-money-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
