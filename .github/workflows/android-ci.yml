name: SKYPLUS MONEY Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Feature branches are tested when they open a PR into main, develop or
    # another feature branch (the UI redesign runs on feature/ui-redesign).
    branches: [ main, develop, 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compile and the full test suite. No environment, no approval, no secrets: this
  # job must stay fast and available on every pull request.
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Robolectric 4.16.1 refuses to create a sandbox for SDK 36 on JDK 17:
      # "Android SDK 36 requires Java 21 (have Java 17)". The test JVM must be 21.
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Compile Debug Kotlin
        run: ./gradlew :app:compileDebugKotlin

      # Blocking gate: every unit and Robolectric test must pass.
      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest

      # Always print an exact count of what the suite actually executed, so the
      # result can be quoted without guessing.
      - name: Summarise test results
        if: always()
        run: |
          set -euo pipefail
          DIR=app/build/test-results/testDebugUnitTest
          if [ ! -d "$DIR" ]; then
            echo "::error::No test results directory at $DIR"
            exit 1
          fi
          echo "Test classes executed: $(find "$DIR" -name 'TEST-*.xml' | wc -l)"
          awk -F'"' '/<testsuite /{for(i=1;i<=NF;i++){if($i ~ /tests=$/){t+=$(i+1)} if($i ~ /failures=$/){f+=$(i+1)} if($i ~ /errors=$/){e+=$(i+1)} if($i ~ /skipped=$/){s+=$(i+1)}}} END{printf "tests=%d failures=%d errors=%d skipped=%d\\n", t, f, e, s}' "$DIR"/TEST-*.xml

      # Report the Room migration integration test independently of the aggregate suite total.
      - name: Verify Room 8-to-9 migration integration test
        if: always()
        run: |
          set -euo pipefail
          REPORT=app/build/test-results/testDebugUnitTest/TEST-com.example.SavingsGoalMigration8To9Test.xml
          if [ ! -f "$REPORT" ]; then
            echo "::error::Room migration integration test report is missing: $REPORT"
            exit 1
          fi
          python3 - "$REPORT" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          report = sys.argv[1]
          suite = ET.parse(report).getroot()
          tests = int(suite.attrib.get("tests", "0"))
          failures = int(suite.attrib.get("failures", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          name = suite.attrib.get("name", "SavingsGoalMigration8To9Test")
          line = (
              f"Room migration integration test ({name}): "
              f"tests={tests} failures={failures} errors={errors} skipped={skipped}"
          )
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Room migration integration test\\n\\n{line}\\n")
          if tests < 1 or failures or errors or skipped:
              print("::error::Room migration integration test did not pass cleanly.")
              raise SystemExit(1)
          PY

  # Signed debug APK. Only on main, and only through the protected environment, so
  # the signing secrets are never reachable from a pull request.
  debug-apk:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: debug-signing
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The debug keystore is provisioned once by .github/workflows/provision-debug-keystore.yml.
      # CI never generates one, so every debug APK keeps the same signing certificate.
      - name: Validate debug signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SKYPLUS_DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SKYPLUS_DEBUG_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SKYPLUS_DEBUG_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKYPLUS_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=0
          for name in SKYPLUS_DEBUG_KEYSTORE_BASE64 SKYPLUS_DEBUG_STORE_PASSWORD SKYPLUS_DEBUG_KEY_PASSWORD SKYPLUS_DEBUG_KEY_ALIAS; do
            case "$name" in
              SKYPLUS_DEBUG_KEYSTORE_BASE64) value="$KEYSTORE_B64" ;;
              SKYPLUS_DEBUG_STORE_PASSWORD) value="$STORE_PASSWORD" ;;
              SKYPLUS_DEBUG_KEY_PASSWORD) value="$KEY_PASSWORD" ;;
              SKYPLUS_DEBUG_KEY_ALIAS) value="$KEY_ALIAS" ;;
            esac
            if [ -z "${value:-}" ]; then
              echo "::error::Required environment secret is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::The stable debug keystore is not provisioned in the debug-signing environment. Run the Provision debug signing keystore workflow first."
            exit 1
          fi
          echo "All required debug signing secrets are present."

      - name: Restore stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.SKYPLUS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/skyplus-debug.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded debug keystore is empty."
            exit 1
          fi
          echo "SKYPLUS_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Debug keystore restored to a temporary path with 0600 permissions."

      - name: Validate keystore and key alias
        env:
          STORE_PASSWORD: ${{ secrets.SKYPLUS_DEBUG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKYPLUS_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$SKYPLUS_DEBUG_KEYSTORE_PATH" \
            -storepass:env STORE_PASSWORD \
            -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore opened and alias '$KEY_ALIAS' exists."

      # Public certificate fingerprints only. No password and no key material is printed.
      - name: Print debug certificate fingerprints
        env:
          STORE_PASSWORD: ${{ secrets.SKYPLUS_DEBUG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKYPLUS_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$SKYPLUS_DEBUG_KEYSTORE_PATH" \
            -storepass:env STORE_PASSWORD \
            -alias "$KEY_ALIAS" \
            | grep -E "SHA1:|SHA256:" \
            | sed 's/^[[:space:]]*//'
          echo "These two values must match the fingerprints registered in Firebase."

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          SKYPLUS_DEBUG_STORE_PASSWORD: ${{ secrets.SKYPLUS_DEBUG_STORE_PASSWORD }}
          SKYPLUS_DEBUG_KEY_PASSWORD: ${{ secrets.SKYPLUS_DEBUG_KEY_PASSWORD }}
          SKYPLUS_DEBUG_KEY_ALIAS: ${{ secrets.SKYPLUS_DEBUG_KEY_ALIAS }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Report APK details
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::Debug APK was not produced at $APK"; exit 1; }
          ls -l "$APK"
          sha256sum "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" | grep -E "^package:|^application-label:" | head -3
          fi

      # Proves the APK really was signed with the provisioned keystore, so a silent
      # fallback to a throw-away key can never ship.
      - name: Verify APK certificate matches the stable keystore
        env:
          STORE_PASSWORD: ${{ secrets.SKYPLUS_DEBUG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKYPLUS_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android build-tools."
            exit 1
          fi
          normalise() { tr -d ':' | tr 'a-f' 'A-F' | tr -d '[:space:]'; }
          KEY_SHA1=$(keytool -list -v -keystore "$SKYPLUS_DEBUG_KEYSTORE_PATH" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | grep -m1 "SHA1:" | cut -d: -f2- | normalise)
          KEY_SHA256=$(keytool -list -v -keystore "$SKYPLUS_DEBUG_KEYSTORE_PATH" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | grep -m1 "SHA256:" | cut -d: -f2- | normalise)
          APK_SHA1=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-1 digest" | awk '{print $NF}' | normalise)
          APK_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | awk '{print $NF}' | normalise)
          echo "keystore SHA-1  : $KEY_SHA1"
          echo "APK      SHA-1  : $APK_SHA1"
          echo "keystore SHA-256: $KEY_SHA256"
          echo "APK      SHA-256: $APK_SHA256"
          if [ "$KEY_SHA1" != "$APK_SHA1" ] || [ "$KEY_SHA256" != "$APK_SHA256" ]; then
            echo "::error::APK signing certificate does not match the provisioned debug keystore."
            exit 1
          fi
          echo "APK signing certificate matches the stable debug keystore."

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skyplus-money-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      # The keystore must never outlive the job, even when an earlier step failed.
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "${SKYPLUS_DEBUG_KEYSTORE_PATH:-/nonexistent}"
          echo "Temporary signing material removed."
