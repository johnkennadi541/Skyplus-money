name: SKYPLUS MONEY - One-time release keystore
# prepare: create encrypted backup only. finalize: create permanent lock only after
# founder confirms download and restore verification on their phone. Manual only.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'prepare first; finalize only after phone-side backup restore verification'
        required: true
        type: choice
        options: [prepare, finalize]
      confirmation:
        description: 'prepare: CREATE-RELEASE-KEYSTORE | finalize: FINALIZE-VERIFIED-BACKUP'
        required: true
        type: string
      prepare_run_id:
        description: 'Successful prepare run ID; required for finalize'
        required: false
        type: string
concurrency:
  group: skyplus-money-create-release-keystore
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read, actions: read }
    steps:
      - name: Confirm prepare
        env: { CONFIRMATION: ${{ inputs.confirmation }} }
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = "CREATE-RELEASE-KEYSTORE" ] || { echo "::error::Confirmation mismatch"; exit 1; }

      - name: Refuse existing lock or earlier successful run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/git/ref/tags/skyplus-signing-key-created")
          [ "$CODE" = "404" ] || { echo "::error::Lock exists or cannot be checked"; exit 1; }
          DATA=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/workflows/create-keystore.yml/runs?status=success&per_page=100")
          COUNT=$(printf '%s' "$DATA" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("workflow_runs",[])))')
          [ "$COUNT" = "0" ] || { echo "::error::Successful prior run exists; refusing second key"; exit 1; }

      - name: Check required secrets
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Required signing secret missing"; exit 1; }
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$BACKUP_PASSPHRASE"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }

      - name: Generate release keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -keystore my-upload-key.jks -storetype JKS -alias upload -keyalg RSA -keysize 4096 -validity 10000 -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=SKYPLUS, OU=SKYPLUS MONEY, O=SKYPLUS, L=Chennai, ST=Tamil Nadu, C=IN"
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null

      - name: Record certificate fingerprints
        env: { STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }} }
        run: |
          set -euo pipefail
          DETAILS=$(keytool -list -v -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload)
          SHA256=$(printf '%s\n' "$DETAILS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d '[:space:]')
          SHA1=$(printf '%s\n' "$DETAILS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1 | tr -d '[:space:]')
          printf '%s' "$SHA256" | grep -Eq '^([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$'
          printf '%s' "$SHA1" | grep -Eq '^([0-9A-Fa-f]{2}:){19}[0-9A-Fa-f]{2}$'
          echo "Release SHA-256: $SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Release SHA-1: $SHA1" >> "$GITHUB_STEP_SUMMARY"
          echo "Do not update GitHub variables or Google Login settings yet; verify phone backup first." >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt and verify backup archive
        env: { BACKUP_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }} }
        run: |
          set -euo pipefail
          umask 077
          base64 -w0 my-upload-key.jks > my-upload-key.jks.base64.txt
          if ! command -v 7z >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; fi
          7z a -t7z -mhe=on -mx=9 -p"$BACKUP_PASSPHRASE" skyplus-money-keystore-backup.7z my-upload-key.jks my-upload-key.jks.base64.txt >/dev/null
          VERIFY="$RUNNER_TEMP/verify"
          mkdir -p "$VERIFY"
          7z t -p"$BACKUP_PASSPHRASE" skyplus-money-keystore-backup.7z >/dev/null
          7z x -p"$BACKUP_PASSPHRASE" -o"$VERIFY" skyplus-money-keystore-backup.7z >/dev/null
          cmp -s my-upload-key.jks "$VERIFY/my-upload-key.jks"
          cmp -s my-upload-key.jks.base64.txt "$VERIFY/my-upload-key.jks.base64.txt"
          rm -rf "$VERIFY"
          echo "Encrypted archive and restore test passed."

      - name: Remove plaintext files from runner
        if: always()
        run: |
          rm -f my-upload-key.jks my-upload-key.jks.base64.txt
          rm -rf "$RUNNER_TEMP/verify"
          test ! -e my-upload-key.jks && test ! -e my-upload-key.jks.base64.txt

      - name: Phone verification instructions
        run: |
          echo "Download skyplus-money-keystore-backup.7z to your phone and extract it with ZArchiver." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify both my-upload-key.jks and my-upload-key.jks.base64.txt are present." >> "$GITHUB_STEP_SUMMARY"
          echo "After successful phone-side restore verification, use prepare run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "No permanent lock has been created yet." >> "$GITHUB_STEP_SUMMARY"

  finalize:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'finalize'
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, actions: read }
    steps:
      - name: Require founder confirmation and prepare run ID
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = "FINALIZE-VERIFIED-BACKUP" ] || { echo "::error::Confirmation mismatch"; exit 1; }
          [[ "$PREPARE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Valid prepare run ID required"; exit 1; }

      - name: Verify successful prepare run and unexpired backup artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          RUN=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$PREPARE_RUN_ID")
          printf '%s' "$RUN" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r.get("conclusion")=="success" and r.get("event")=="workflow_dispatch" and r.get("head_branch")=="main" and r.get("path")==".github/workflows/create-keystore.yml"'
          ARTIFACTS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$PREPARE_RUN_ID/artifacts")
          printf '%s' "$ARTIFACTS" | python3 -c 'import json,sys; a=json.load(sys.stdin).get("artifacts",[]); assert len([x for x in a if x.get("name")=="skyplus-money-keystore-backup" and not x.get("expired")])==1'
          echo "Successful prepare run and unexpired encrypted backup verified."

      - name: Ensure permanent lock is absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/git/ref/tags/skyplus-signing-key-created")
          [ "$CODE" = "404" ] || { echo "::error::Lock exists or cannot be checked"; exit 1; }

      - name: Create permanent lock after founder confirms phone restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"ref":"refs/tags/skyplus-signing-key-created","sha":os.environ["COMMIT_SHA"]}))')
          CODE=$(curl -sS -o "$RUNNER_TEMP/lock.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d "$PAYLOAD" "https://api.github.com/repos/$REPO/git/refs")
          [ "$CODE" = "201" ] || { echo "::error::Lock creation failed (HTTP $CODE)"; cat "$RUNNER_TEMP/lock.json"; exit 1; }
          echo "Permanent lock created after founder-confirmed phone restore. Prepare run: $PREPARE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Never delete, reset, or bypass this lock." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup with 90-day retention
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skyplus-money-keystore-backup
          path: skyplus-money-keystore-backup.7z
          retention-days: 90
          if-no-files-found: error

