name: SKYPLUS MONEY - One-time release keystore

# Run this ONLY once, by hand, from the Actions tab.
# It never runs on push and it never builds an APK.
#
# Secrets required before running:
#   STORE_PASSWORD             keystore password, chosen by the founder
#   KEY_PASSWORD               key password, chosen by the founder
#   KEYSTORE_BACKUP_PASSPHRASE passphrase for the encrypted backup archive
# Variable required afterwards:
#   RELEASE_CERT_SHA256        printed in the job summary of this run
# Every secret is passed through the step's env: block and referenced as "$NAME".
# No secret is ever written into the shell text with ${{ }} interpolation.
#
# ONE-TIME PROTECTION - four independent layers, in this exact order:
#   Layer 0  run_attempt must be 1. A re-run of the same run is refused.
#   Layer 1  the repository variable RELEASE_CERT_SHA256 must be empty.
#   Layer 2  no earlier SUCCESSFUL run of this workflow may exist.
#   Precheck the three secrets must be present, so a missing secret can never
#            leave a permanent lock behind.
#   Layer 3  the permanent lock ref refs/tags/skyplus-signing-key-created is
#            acquired ATOMICALLY before the key is generated. GitHub creates a
#            ref only if it does not already exist, so exactly one run can ever
#            acquire it, and it is never deleted by this workflow.
#   concurrency with cancel-in-progress: false serialises runs as extra safety.
#
# PERMISSIONS (job level, least privilege):
#   contents: write  required to create the lock ref (a write to the repository)
#   actions: read    required to read the successful-run history
# Nothing else is requested. release-apk.yml and android-ci.yml stay at
# contents: read and are not modified by this workflow.
#
# TAG PROTECTION (a repository setting, done by the founder, not by this file):
#   Settings -> Rules -> Rulesets -> New ruleset -> New tag ruleset
#   Target tags: skyplus-signing-key-created
#   Enable : Restrict updates, Restrict deletions
#   Do NOT enable Restrict creations - the workflow must be able to create the tag
#   State  : Active
#   Bypass : leave the default so that repository admins can still delete the tag
#            during the manual recovery procedure, and add nobody else. If you add
#            a bypass for Actions, the workflow itself could delete the lock, which
#            defeats the purpose, so do not.

on:
  workflow_dispatch:

concurrency:
  group: skyplus-money-create-release-keystore
  cancel-in-progress: false

jobs:
  create-keystore:
    name: Create release keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Layer 0 - refuse a re-run of the same workflow run
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "${RUN_ATTEMPT:-}" in
            ''|*[!0-9]*)
              echo "::error::Could not read github.run_attempt. Failing closed."
              exit 1
              ;;
          esac
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "::error::This is attempt ${RUN_ATTEMPT} of run ${GITHUB_RUN_ID}. Re-running the same run is refused, so a second signing key can never be generated. If the earlier attempt failed before any key was delivered, start a NEW run from the Actions tab instead of re-running this one."
            exit 1
          fi
          echo "Attempt 1 of run ${GITHUB_RUN_ID} - allowed to continue."

      - name: Layer 1 and Layer 2 - registered certificate and run history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EXISTING_FINGERPRINT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          echo "Layer 1: checking whether a release certificate is already registered..."
          if [ -n "${EXISTING_FINGERPRINT:-}" ]; then
            echo "::error::RELEASE_CERT_SHA256 is already set, so a release keystore already exists. This workflow must never run again."
            exit 1
          fi
          echo "Layer 1 passed: no registered certificate."

          echo "Layer 2: checking earlier successful runs of this workflow..."
          API="https://api.github.com/repos/${REPO}/actions/workflows/create-keystore.yml/runs?status=success&per_page=100"
          if ! RAW=$(curl -sS -w '\n%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API"); then
            echo "::error::Could not reach the GitHub API. Failing closed instead of risking a second key."
            exit 1
          fi
          CODE=$(printf '%s' "$RAW" | tail -n1)
          BODY=$(printf '%s' "$RAW" | sed '$d')
          if [ "$CODE" != "200" ]; then
            echo "::error::GitHub API returned HTTP $CODE. Failing closed instead of risking a second key."
            exit 1
          fi
          export CURRENT_RUN_ID
          if ! COUNT=$(printf '%s' "$BODY" | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          current = str(os.environ["CURRENT_RUN_ID"])
          runs = data.get("workflow_runs", [])
          print(sum(1 for r in runs if str(r.get("id")) != current))
          '); then
            echo "::error::Could not parse the workflow run history. Failing closed instead of risking a second key."
            exit 1
          fi
          if [ "$COUNT" != "0" ]; then
            echo "::error::This workflow already finished successfully ${COUNT} time(s) before. A signing key exists, so no second key will be created."
            exit 1
          fi
          echo "Layer 2 passed: no earlier successful run."

      - name: Precheck - all three signing secrets must be present
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$BACKUP_PASSPHRASE"
          missing=""
          [ -n "${STORE_PASSWORD:-}" ] || missing="$missing STORE_PASSWORD"
          [ -n "${KEY_PASSWORD:-}" ] || missing="$missing KEY_PASSWORD"
          [ -n "${BACKUP_PASSPHRASE:-}" ] || missing="$missing KEYSTORE_BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Stopping BEFORE the permanent lock is created, so no lock is left behind."
            exit 1
          fi
          echo "All three secrets are present. The lock may now be acquired safely."

      - name: Layer 3 - acquire the permanent one-time lock atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          LOCK_TAG="skyplus-signing-key-created"
          LOCK_REF="refs/tags/${LOCK_TAG}"
          CREATE_API="https://api.github.com/repos/${REPO}/git/refs"
          READ_API="https://api.github.com/repos/${REPO}/git/ref/tags/${LOCK_TAG}"
          PAYLOAD="{\"ref\":\"${LOCK_REF}\",\"sha\":\"${COMMIT_SHA}\"}"

          echo "Acquiring the permanent lock ${LOCK_REF} ..."
          if ! RAW=$(curl -sS -w '\n%{http_code}' -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$CREATE_API"); then
            echo "::error::Could not reach the GitHub API to acquire the lock. Failing closed: no key was generated."
            exit 1
          fi
          CODE=$(printf '%s' "$RAW" | tail -n1)
          BODY=$(printf '%s' "$RAW" | sed '$d')

          if [ "$CODE" = "201" ]; then
            echo "Lock acquired. No other run can ever acquire it, because GitHub refuses to create a ref that already exists."
          elif [ "$CODE" = "422" ] || [ "$CODE" = "409" ]; then
            echo "Lock creation was refused with HTTP ${CODE}. Checking whether the lock ref already exists ..."
            if ! RAW2=$(curl -sS -w '\n%{http_code}' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$READ_API"); then
              echo "::error::Could not reach the GitHub API to read the lock ref. Failing closed: no key was generated."
              exit 1
            fi
            CODE2=$(printf '%s' "$RAW2" | tail -n1)
            BODY2=$(printf '%s' "$RAW2" | sed '$d')
            case "$CODE2" in
              200)
                echo "::error::The permanent lock ${LOCK_REF} already exists. A signing key has already been created for this repository, so no second key will be generated. This workflow must not be run again."
                echo "$BODY2"
                exit 1
                ;;
              404)
                echo "::error::The lock could not be created (HTTP ${CODE}) and the ref does not exist (HTTP 404). This is a GitHub API validation or conflict error, not an existing lock. Failing closed: no key was generated."
                echo "$BODY"
                exit 1
                ;;
              *)
                echo "::error::Unexpected HTTP ${CODE2} while checking the lock ref. Failing closed: no key was generated."
                echo "$BODY2"
                exit 1
                ;;
            esac
          elif [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "::error::GitHub refused the lock with HTTP ${CODE}. The workflow token needs contents: write. Failing closed: no key was generated."
            echo "$BODY"
            exit 1
          else
            echo "::error::Unexpected HTTP ${CODE} while acquiring the lock. Failing closed: no key was generated."
            echo "$BODY"
            exit 1
          fi

          {
            echo "### One-time lock"
            echo ""
            echo '```'
            echo "ref   : ${LOCK_REF}"
            echo "pointed at commit: ${COMMIT_SHA}"
            echo "acquired by run : ${RUN_ID}"
            echo '```'
            echo ""
            echo "This tag is the permanent lock. It must not be deleted once the"
            echo "artifact upload step has succeeded. See the recovery rules."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the release keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          keytool -genkeypair \
            -keystore my-upload-key.jks \
            -storetype JKS \
            -alias upload \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=SKYPLUS, OU=SKYPLUS MONEY, O=SKYPLUS, L=Chennai, ST=Tamil Nadu, C=IN"
          test -s my-upload-key.jks || { echo "::error::Keystore file was not created"; exit 1; }
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload > /dev/null \
            || { echo "::error::Alias 'upload' is missing from the new keystore"; exit 1; }
          echo "Keystore generated and alias 'upload' confirmed."

      - name: Record the certificate fingerprints
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STORE_PASSWORD"
          if ! DETAILS=$(keytool -list -v -keystore my-upload-key.jks \
                -storepass "$STORE_PASSWORD" -alias upload); then
            echo "::error::keytool failed while reading the certificate details"
            exit 1
          fi
          SHA256=$(printf '%s\n' "$DETAILS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d '[:space:]')
          SHA1=$(printf '%s\n' "$DETAILS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1 | tr -d '[:space:]')
          VALID=$(printf '%s\n' "$DETAILS" | sed -n 's/^[[:space:]]*Valid from: //p' | head -1)
          if [ -z "$SHA256" ]; then
            echo "::error::SHA-256 fingerprint could not be extracted from the keytool output"
            exit 1
          fi
          if [ -z "$SHA1" ]; then
            echo "::error::SHA-1 fingerprint could not be extracted from the keytool output"
            exit 1
          fi
          {
            echo "### Release certificate (permanent)"
            echo ""
            echo '```'
            echo "Alias     : upload"
            echo "Valid from: ${VALID:-unknown}"
            echo "SHA-256   : $SHA256"
            echo "SHA-1     : $SHA1"
            echo '```'
            echo ""
            echo "Create the repository VARIABLE RELEASE_CERT_SHA256 with this value."
            echo "That variable is Layer 1 of the one-time protection:"
            echo ""
            echo '```'
            echo "RELEASE_CERT_SHA256=$SHA256"
            echo '```'
            echo ""
            echo "Google Cloud API key restriction needs the package name and the SHA-1:"
            echo ""
            echo '```'
            echo "package: com.skyplus.money"
            echo "SHA-1  : $SHA1"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Fingerprints recorded in the job summary."

      - name: Prepare the base64 text used for the KEYSTORE_BASE64 secret
        run: |
          set -euo pipefail
          umask 077
          base64 -w0 my-upload-key.jks > my-upload-key.jks.base64.txt
          test -s my-upload-key.jks.base64.txt || { echo "::error::Base64 file is empty"; exit 1; }
          echo "Base64 text written: $(wc -c < my-upload-key.jks.base64.txt) characters."

      - name: Encrypt the keystore for the artifact
        env:
          BACKUP_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          echo "::add-mask::$BACKUP_PASSPHRASE"
          if ! command -v 7z > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
          command -v 7z > /dev/null || { echo "::error::7z is not available on the runner"; exit 1; }
          7z a -t7z -mhe=on -mx=9 -p"$BACKUP_PASSPHRASE" \
            skyplus-money-keystore-backup.7z \
            my-upload-key.jks my-upload-key.jks.base64.txt > /dev/null
          test -s skyplus-money-keystore-backup.7z || { echo "::error::Encrypted archive was not created"; exit 1; }
          echo "Encrypted archive created."

      - name: Prove the archive can be opened again
        env:
          BACKUP_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          echo "::add-mask::$BACKUP_PASSPHRASE"
          VERIFY="$RUNNER_TEMP/backup-verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          7z t -p"$BACKUP_PASSPHRASE" skyplus-money-keystore-backup.7z > /dev/null \
            || { echo "::error::Archive integrity test failed"; exit 1; }
          7z x -p"$BACKUP_PASSPHRASE" -o"$VERIFY" skyplus-money-keystore-backup.7z > /dev/null \
            || { echo "::error::Archive could not be extracted with the passphrase"; exit 1; }
          cmp -s my-upload-key.jks "$VERIFY/my-upload-key.jks" \
            || { echo "::error::Recovered keystore does not match the original"; exit 1; }
          cmp -s my-upload-key.jks.base64.txt "$VERIFY/my-upload-key.jks.base64.txt" \
            || { echo "::error::Recovered base64 text does not match the original"; exit 1; }
          echo "Archive opens with the passphrase and both files are byte-identical."
          rm -rf "$VERIFY"

      - name: Cleanup - remove every plaintext copy from the runner
        if: always()
        run: |
          set -euo pipefail
          VERIFY="$RUNNER_TEMP/backup-verify"
          rm -f my-upload-key.jks my-upload-key.jks.base64.txt
          rm -rf "$VERIFY"
          rc=0
          for f in my-upload-key.jks my-upload-key.jks.base64.txt; do
            if [ -e "$f" ]; then
              echo "::error::Plaintext file still present: $f"
              rc=1
            fi
          done
          if [ -e "$VERIFY" ]; then
            echo "::error::Verification directory still present: $VERIFY"
            rc=1
          fi
          if find . -maxdepth 4 -name 'my-upload-key.jks*' -print -quit | grep -q .; then
            echo "::error::A plaintext keystore copy is still inside the workspace"
            rc=1
          fi
          if [ "$rc" -ne 0 ]; then
            exit 1
          fi
          echo "All plaintext signing material is absent from the runner."

      - name: Upload the encrypted backup as a temporary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skyplus-money-keystore-backup
          path: skyplus-money-keystore-backup.7z
          retention-days: 1
          if-no-files-found: error

      - name: Final instruction
        run: |
          echo "The permanent lock tag skyplus-signing-key-created now exists and is never deleted automatically."
          echo "Download the artifact, extract it on your phone with ZArchiver, set KEYSTORE_BASE64,"
          echo "then create the repository variable RELEASE_CERT_SHA256 from this run's summary."
          echo "RECOVERY: reset the tag ONLY if the artifact upload step did not succeed,"
          echo "no artifact exists in this run, and you never received or stored the keystore."
          echo "Never reset the tag if the artifact upload step succeeded, even if the artifact has expired."
