name: SKYPLUS MONEY Dependency Security Scan

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop, 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-functions-audit:
    name: Firebase Functions npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d0b2f1c7b2a4e5e6a5c7c9d3c2f # v4
        with:
          node-version: 22

      - name: Resolve npm dependency tree without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

  android-dependency-graph:
    name: Submit resolved Android dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Submit Gradle dependency graph to GitHub
        uses: gradle/actions/dependency-submission@v4
