name: Firebase Functions Type Check

on:
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions.yml"
  push:
    branches:
      - feature/complete-app-experience
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
