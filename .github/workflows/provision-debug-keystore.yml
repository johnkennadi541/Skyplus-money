name: Provision debug signing keystore

# MANUAL ONLY. This workflow never runs automatically, never on a push and never on
# a pull request. The founder runs it once from the main branch, after approving the
# debug-signing environment deployment, and it writes the four signing secrets.
on:
  workflow_dispatch:

# The workflow's own GITHUB_TOKEN gets no permissions. Every API call uses the
# short-lived GitHub App installation token minted below.
permissions: {}

concurrency:
  group: provision-debug-keystore
  cancel-in-progress: false

jobs:
  provision:
    # main only. A dispatch from any other branch is skipped entirely.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The protected environment gates this job behind manual approval and supplies
    # the App credentials. Nothing below runs until the approval is granted.
    environment: debug-signing
    permissions: {}

    env:
      ENVIRONMENT_NAME: debug-signing
      KEY_ALIAS: skyplusdebug
      REPO: ${{ github.repository }}

    steps:
      # The token is scoped to this repository and to the two permissions the design
      # approved. It expires in one hour and is never printed.
      - name: Mint a scoped GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYPLUS_APP_ID }}
          private-key: ${{ secrets.SKYPLUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-environments: write
          permission-secrets: write

      - name: Refuse to run outside main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This workflow must run from the main branch only."
            exit 1
          fi
          echo "Running from main."

      # The job's environment declaration creates the environment if it is missing,
      # so existence is not enough: the protection rules must already be configured.
      - name: Require a protected environment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! json=$(gh api "repos/${REPO}/environments/${ENVIRONMENT_NAME}" 2>/dev/null); then
            echo "::error::Environment ${ENVIRONMENT_NAME} does not exist. Create it first with required reviewers and a main-only deployment branch policy."
            exit 1
          fi
          rules=$(printf '%s' "$json" | jq '.protection_rules | length')
          echo "protection_rules: ${rules}"
          if [ "${rules}" -eq 0 ]; then
            echo "::error::Environment ${ENVIRONMENT_NAME} has no protection rules. Add required reviewers and a deployment branch policy restricted to main before provisioning."
            exit 1
          fi
          echo "Environment is protected."

      # Passwords are generated here, never chosen or typed by a human, and never
      # printed. The keystore lives only under $RUNNER_TEMP with 0600 permissions.
      - name: Generate the debug keystore
        run: |
          set -euo pipefail
          umask 077
          KS="${RUNNER_TEMP}/skyplus-debug.jks"
          STORE_PASS_FILE="${RUNNER_TEMP}/store.pass"
          KEY_PASS_FILE="${RUNNER_TEMP}/key.pass"

          openssl rand -base64 24 | tr -d '\n' > "${STORE_PASS_FILE}"
          openssl rand -base64 24 | tr -d '\n' > "${KEY_PASS_FILE}"
          chmod 600 "${STORE_PASS_FILE}" "${KEY_PASS_FILE}"

          export SKYPLUS_STORE_PASS="$(cat "${STORE_PASS_FILE}")"
          export SKYPLUS_KEY_PASS="$(cat "${KEY_PASS_FILE}")"

          keytool -genkeypair \
            -keystore "${KS}" \
            -storetype JKS \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env SKYPLUS_STORE_PASS \
            -keypass:env SKYPLUS_KEY_PASS \
            -dname "CN=SKYPLUS Debug,O=SKYPLUS,C=IN" > /dev/null

          chmod 600 "${KS}"
          base64 -w0 "${KS}" > "${RUNNER_TEMP}/keystore.b64"
          chmod 600 "${RUNNER_TEMP}/keystore.b64"

          unset SKYPLUS_STORE_PASS SKYPLUS_KEY_PASS
          echo "Keystore generated in the temporary workspace."

      # Public values only. These two lines are what the founder registers in Firebase.
      - name: Print the public certificate fingerprints
        run: |
          set -euo pipefail
          export SKYPLUS_STORE_PASS="$(cat "${RUNNER_TEMP}/store.pass")"
          keytool -list -v \
            -keystore "${RUNNER_TEMP}/skyplus-debug.jks" \
            -alias "${KEY_ALIAS}" \
            -storepass:env SKYPLUS_STORE_PASS \
            | grep -E "SHA1:|SHA256:" \
            | sed 's/^[[:space:]]*//'
          unset SKYPLUS_STORE_PASS
          echo "Register both values in Firebase for com.skyplus.money."

      # Values are piped on stdin. --body is never used for a secret value, so nothing
      # reaches the process argument list.
      - name: Write the four signing secrets into the environment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh secret set SKYPLUS_DEBUG_KEYSTORE_BASE64 --env "${ENVIRONMENT_NAME}" --repo "${REPO}" < "${RUNNER_TEMP}/keystore.b64"
          gh secret set SKYPLUS_DEBUG_STORE_PASSWORD --env "${ENVIRONMENT_NAME}" --repo "${REPO}" < "${RUNNER_TEMP}/store.pass"
          gh secret set SKYPLUS_DEBUG_KEY_PASSWORD --env "${ENVIRONMENT_NAME}" --repo "${REPO}" < "${RUNNER_TEMP}/key.pass"
          gh secret set SKYPLUS_DEBUG_KEY_ALIAS --env "${ENVIRONMENT_NAME}" --repo "${REPO}" --body "${KEY_ALIAS}"
          echo "Four secrets written to ${ENVIRONMENT_NAME}."

      - name: Verify all four secrets exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh secret list --env "${ENVIRONMENT_NAME}" --repo "${REPO}" | awk '{print $1}' | sort > "${RUNNER_TEMP}/secret-names.txt"
          missing=0
          for name in SKYPLUS_DEBUG_KEYSTORE_BASE64 SKYPLUS_DEBUG_STORE_PASSWORD SKYPLUS_DEBUG_KEY_PASSWORD SKYPLUS_DEBUG_KEY_ALIAS; do
            if ! grep -qx "${name}" "${RUNNER_TEMP}/secret-names.txt"; then
              echo "::error::Secret ${name} is missing after provisioning."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "All four signing secrets are present (names only were read)."

      # Runs even after a failure. No artifact is uploaded anywhere, ever.
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/skyplus-debug.jks" \
                "${RUNNER_TEMP}/keystore.b64" \
                "${RUNNER_TEMP}/store.pass" \
                "${RUNNER_TEMP}/key.pass" \
                "${RUNNER_TEMP}/secret-names.txt"
          echo "Temporary signing material removed."
