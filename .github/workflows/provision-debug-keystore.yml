name: Provision debug signing keystore

# MANUAL ONLY. This workflow never runs automatically, never on a push and never on
# a pull request. The founder runs it once from the main branch, after approving the
# debug-signing environment deployment, and it writes the four signing secrets.
#
# READ FIRST: docs/DEBUG_KEYSTORE_SETUP.md, section "APK update compatibility".
# A newly generated keystore can never update an APK that is already installed under
# a different signing certificate.
on:
  workflow_dispatch:

# The workflow's own GITHUB_TOKEN gets no permissions. Every API call uses the
# short-lived GitHub App installation token minted below.
permissions: {}

concurrency:
  group: provision-debug-keystore
  cancel-in-progress: false

jobs:
  provision:
    # main only. A dispatch from any other branch is skipped entirely.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The protected environment gates this job behind manual approval and supplies
    # the App credentials. Nothing below runs until the approval is granted.
    environment: debug-signing
    permissions: {}

    env:
      ENVIRONMENT_NAME: debug-signing
      KEY_ALIAS: skyplusdebug
      REPO: ${{ github.repository }}

    steps:
      # Permissions requested, and why each one is here:
      #   environments: write - read the environment and its deployment branch policy,
      #                         and reach the environment secret endpoints.
      #   metadata: read      - granted to every App automatically; nothing to request.
      # Deliberately NOT requested: contents, actions, administration, workflows.
      #
      # The token is scoped to this one repository and expires in one hour.
      - name: Mint a scoped GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYPLUS_APP_ID }}
          private-key: ${{ secrets.SKYPLUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-environments: write

      - name: Refuse to run outside main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This workflow must run from the main branch only."
            exit 1
          fi
          echo "Running from main."

      # Referencing an environment in a workflow can cause GitHub to create it, so this
      # check deliberately does not claim the environment existed beforehand. What it
      # verifies is the configuration that must be in place before any key material is
      # generated: required reviewers and a custom deployment branch policy listing
      # exactly main. The number of protection rules alone is not treated as proof, and
      # any condition that cannot be verified fails the job closed.
      - name: Require a protected environment restricted to main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if ! json=$(gh api "repos/${REPO}/environments/${ENVIRONMENT_NAME}" 2>/dev/null); then
            echo "::error::Environment ${ENVIRONMENT_NAME} could not be read, or does not exist. Create it manually with required reviewers and a main-only deployment branch policy."
            exit 1
          fi

          reviewers=$(printf '%s' "$json" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers | length)] | add // 0')
          echo "required reviewers configured: ${reviewers}"
          if [ "${reviewers}" -lt 1 ]; then
            echo "::error::Environment ${ENVIRONMENT_NAME} has no required reviewers. Add at least one reviewer before provisioning."
            exit 1
          fi

          protected=$(printf '%s' "$json" | jq -r '.deployment_branch_policy.protected_branches // false')
          custom=$(printf '%s' "$json" | jq -r '.deployment_branch_policy.custom_branch_policies // false')
          echo "deployment branch policy: protected_branches=${protected} custom_branch_policies=${custom}"

          if [ "${custom}" != "true" ]; then
            echo "::error::Environment ${ENVIRONMENT_NAME} must use a custom deployment branch policy restricted to main. It cannot be verified from a protected-branches rule, so the job fails closed."
            exit 1
          fi

          if ! policies=$(gh api "repos/${REPO}/environments/${ENVIRONMENT_NAME}/deployment-branch-policies" --jq '.branch_policies[].name'); then
            echo "::error::The deployment branch policies of ${ENVIRONMENT_NAME} could not be read."
            exit 1
          fi
          echo "deployment branch policies:"; printf '%s\n' "$policies"

          if ! printf '%s\n' "$policies" | grep -qx "main"; then
            echo "::error::The deployment branch policy of ${ENVIRONMENT_NAME} does not include main."
            exit 1
          fi
          if printf '%s\n' "$policies" | grep -qE '[*?]'; then
            echo "::error::The deployment branch policy of ${ENVIRONMENT_NAME} contains a wildcard pattern. Restrict it to main only."
            exit 1
          fi
          if [ "$(printf '%s\n' "$policies" | grep -vc '^$')" -ne 1 ]; then
            echo "::error::The deployment branch policy of ${ENVIRONMENT_NAME} allows more than one branch. Restrict it to main only."
            exit 1
          fi

          echo "Environment has required reviewers and is restricted to main."

      # ONE-TIME GUARD. Runs before any key material exists and before any secret is
      # touched. A second provisioning run would silently replace the signing identity
      # and make every installed APK impossible to update, so it is refused here.
      #
      # It checks ALL FOUR signing secrets, not just the keystore: a leftover password or
      # alias from an earlier run is just as much evidence of an existing identity, and
      # continuing would overwrite it. One present name is enough to abort.
      #
      # Only secret NAMES are listed. No secret value is fetched, printed or compared.
      - name: Refuse to replace an existing signing identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # A failed listing must never be mistaken for an empty list, so the exit status
          # is checked explicitly and the run fails closed on any error.
          if ! listing=$(gh secret list --env "${ENVIRONMENT_NAME}" --repo "${REPO}" 2>&1); then
            echo "::error::The existing environment secrets could not be listed, so the one-time guard cannot be verified."
            echo "::error::Failing closed rather than risking a replacement. Nothing was generated and no secret was modified."
            exit 1
          fi

          existing=$(printf '%s\n' "${listing}" | awk 'NF {print $1}')

          found=""
          found_count=0
          for name in \
            SKYPLUS_DEBUG_KEYSTORE_BASE64 \
            SKYPLUS_DEBUG_STORE_PASSWORD \
            SKYPLUS_DEBUG_KEY_PASSWORD \
            SKYPLUS_DEBUG_KEY_ALIAS; do
            if printf '%s\n' "${existing}" | grep -qx "${name}"; then
              found="${found} ${name}"
              found_count=$((found_count + 1))
            fi
          done

          if [ "${found_count}" -gt 0 ]; then
            echo "::error::Provisioning refused: ${found_count} of the 4 signing secrets already exist in ${ENVIRONMENT_NAME}."
            echo "::error::Existing secret names:${found}"
            echo "::error::This workflow is one-time only. It will not replace an existing signing identity, and it will not overwrite any existing secret."
            echo "::error::Replacing the identity would make every installed SKYPLUS MONEY APK impossible to update in place."
            echo "::error::If the identity must change, follow the reviewed replacement procedure in docs/DEBUG_KEYSTORE_SETUP.md."
            echo "::error::Nothing was generated and no secret was modified."
            exit 1
          fi

          echo "None of the four signing secrets exist in ${ENVIRONMENT_NAME}. First-time provisioning may continue."

      # Verifies public-key read access on the environment secrets endpoint before a
      # single byte of key material is generated. It proves the token can read the
      # environment public key; it does not claim anything about write permission.
      - name: Prove the token can read the environment secret public key
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${REPO}/environments/${ENVIRONMENT_NAME}/secrets/public-key" > /dev/null 2>&1; then
            echo "::error::The App token cannot read the environment secret public key."
            echo "::error::Check that the App has Environments: Read and write, that the installation covers this repository, and that the token requests permission-environments: write."
            exit 1
          fi
          echo "Token can read the environment secret public key."

      # Passwords are generated here, never chosen or typed by a human, and never
      # printed. The keystore lives only under $RUNNER_TEMP with 0600 permissions.
      - name: Generate the debug keystore
        run: |
          set -euo pipefail
          umask 077
          KS="${RUNNER_TEMP}/skyplus-debug.jks"
          STORE_PASS_FILE="${RUNNER_TEMP}/store.pass"
          KEY_PASS_FILE="${RUNNER_TEMP}/key.pass"

          openssl rand -base64 24 | tr -d '\n' > "${STORE_PASS_FILE}"
          openssl rand -base64 24 | tr -d '\n' > "${KEY_PASS_FILE}"
          chmod 600 "${STORE_PASS_FILE}" "${KEY_PASS_FILE}"

          export SKYPLUS_STORE_PASS="$(cat "${STORE_PASS_FILE}")"
          export SKYPLUS_KEY_PASS="$(cat "${KEY_PASS_FILE}")"

          keytool -genkeypair \
            -keystore "${KS}" \
            -storetype JKS \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env SKYPLUS_STORE_PASS \
            -keypass:env SKYPLUS_KEY_PASS \
            -dname "CN=SKYPLUS Debug,O=SKYPLUS,C=IN" > /dev/null

          chmod 600 "${KS}"
          base64 -w0 "${KS}" > "${RUNNER_TEMP}/keystore.b64"
          chmod 600 "${RUNNER_TEMP}/keystore.b64"

          unset SKYPLUS_STORE_PASS SKYPLUS_KEY_PASS
          echo "Keystore generated in the temporary workspace."

      # Public values only. These two lines are what the founder registers in Firebase.
      - name: Print the public certificate fingerprints
        run: |
          set -euo pipefail
          export SKYPLUS_STORE_PASS="$(cat "${RUNNER_TEMP}/store.pass")"
          keytool -list -v \
            -keystore "${RUNNER_TEMP}/skyplus-debug.jks" \
            -alias "${KEY_ALIAS}" \
            -storepass:env SKYPLUS_STORE_PASS \
            | grep -E "SHA1:|SHA256:" \
            | sed 's/^[[:space:]]*//'
          unset SKYPLUS_STORE_PASS
          echo "Register both values in Firebase for com.skyplus.money."
          echo "WARNING: an APK signed with this new key cannot update an APK installed with a different certificate."

      # Values are piped on stdin. --body is never used for a secret value, so nothing
      # reaches the process argument list.
      - name: Write the four signing secrets into the environment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh secret set SKYPLUS_DEBUG_KEYSTORE_BASE64 --env "${ENVIRONMENT_NAME}" --repo "${REPO}" < "${RUNNER_TEMP}/keystore.b64"
          gh secret set SKYPLUS_DEBUG_STORE_PASSWORD --env "${ENVIRONMENT_NAME}" --repo "${REPO}" < "${RUNNER_TEMP}/store.pass"
          gh secret set SKYPLUS_DEBUG_KEY_PASSWORD --env "${ENVIRONMENT_NAME}" --repo "${REPO}" < "${RUNNER_TEMP}/key.pass"
          gh secret set SKYPLUS_DEBUG_KEY_ALIAS --env "${ENVIRONMENT_NAME}" --repo "${REPO}" --body "${KEY_ALIAS}"
          echo "Four secrets written to ${ENVIRONMENT_NAME}."

      - name: Verify all four secrets exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh secret list --env "${ENVIRONMENT_NAME}" --repo "${REPO}" | awk '{print $1}' | sort > "${RUNNER_TEMP}/secret-names.txt"
          missing=0
          for name in SKYPLUS_DEBUG_KEYSTORE_BASE64 SKYPLUS_DEBUG_STORE_PASSWORD SKYPLUS_DEBUG_KEY_PASSWORD SKYPLUS_DEBUG_KEY_ALIAS; do
            if ! grep -qx "${name}" "${RUNNER_TEMP}/secret-names.txt"; then
              echo "::error::Secret ${name} is missing after provisioning."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "All four signing secrets are present (names only were read)."

      # Runs even after a failure. No artifact is uploaded anywhere, ever.
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/skyplus-debug.jks" \
                "${RUNNER_TEMP}/keystore.b64" \
                "${RUNNER_TEMP}/store.pass" \
                "${RUNNER_TEMP}/key.pass" \
                "${RUNNER_TEMP}/secret-names.txt"
          echo "Temporary signing material removed."
