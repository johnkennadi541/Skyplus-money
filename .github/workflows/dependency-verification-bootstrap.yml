name: Generate Gradle dependency verification metadata

on:
  push:
    branches:
      - security/dependency-verification-bootstrap

permissions:
  contents: read

jobs:
  generate-metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # This is an isolated bootstrap run: checksums are generated from artifacts
      # actually resolved by Gradle, then reviewed before they are trusted.
      - name: Resolve build, test, lint and Android test dependencies
        run: >
          ./gradlew
          --write-verification-metadata sha256
          :app:compileDebugKotlin
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebugAndroidTest
          --no-daemon
          --stacktrace

      - name: Validate generated metadata exists and report counts
        run: |
          set -euo pipefail
          FILE=gradle/verification-metadata.xml
          test -s "$FILE"
          echo "Generated metadata SHA-256:"
          sha256sum "$FILE"
          python3 - "$FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          components = root.findall(".//components/component")
          artifacts = root.findall(".//components/component/artifact")
          print(f"Verified components: {len(components)}")
          print(f"Verified artifacts: {len(artifacts)}")
          if not components or not artifacts:
              raise SystemExit("Generated verification metadata is unexpectedly empty.")
          PY

      - name: Upload generated verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-verification-metadata-bootstrap
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 7
