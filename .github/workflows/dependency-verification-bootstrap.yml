name: Generate Gradle dependency verification metadata

on:
  push:
    branches:
      - security/dependency-verification-bootstrap

permissions:
  contents: write

jobs:
  generate-metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # This is an isolated bootstrap run: checksums are generated from artifacts
      # actually resolved by Gradle, then reviewed before they are trusted.
      - name: Resolve build, test, lint and Android test dependencies
        run: >
          ./gradlew
          --write-verification-metadata sha256
          :app:compileDebugKotlin
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileDebugAndroidTestKotlin
          --no-daemon
          --stacktrace

      - name: Validate generated metadata exists and report counts
        run: |
          set -euo pipefail
          FILE=gradle/verification-metadata.xml
          test -s "$FILE"
          echo "Generated metadata SHA-256:"
          sha256sum "$FILE"
          python3 - "$FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          # Match by local tag name so Gradle XML namespace/prefix changes do
          # not make a valid metadata file look empty.
          local_name = lambda tag: tag.rsplit("}", 1)[-1]
          elements = list(root.iter())
          components = [node for node in elements if local_name(node.tag) == "component"]
          artifacts = [node for node in elements if local_name(node.tag) == "artifact"]
          checksums = [node for node in elements if local_name(node.tag) in {"sha256", "sha512"}]
          print(f"Root element: {root.tag}")
          print(f"Verified components: {len(components)}")
          print(f"Verified artifacts: {len(artifacts)}")
          print(f"Checksum entries: {len(checksums)}")
          if not components or not artifacts or not checksums:
              print("Top-level child elements:", [child.tag for child in root])
              raise SystemExit("Generated verification metadata has no component/artifact checksums.")
          PY

      - name: Commit reviewed bootstrap metadata to isolated branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Verification metadata is unchanged."
          else
            git commit -m "Add generated Gradle dependency verification metadata"
            git push origin HEAD:security/dependency-verification-bootstrap
          fi

      - name: Upload generated verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-verification-metadata-bootstrap
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 7
