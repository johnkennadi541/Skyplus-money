name: Bootstrap complete Gradle verification metadata
on:
  push:
    branches:
      - security/bootstrap-all-gradle-dependencies
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Resolve compile and runtime dependency classpaths and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/resolve-all.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
            gradle.rootProject.tasks.register("resolveAllForVerification") {
              doLast {
                gradle.rootProject.allprojects.each { p ->
                  p.configurations.findAll { cfg ->
                    cfg.canBeResolved && !cfg.name.startsWith("_") &&
                      (cfg.name.endsWith("CompileClasspath") || cfg.name.endsWith("RuntimeClasspath") || cfg.name.endsWith("AnnotationProcessor"))
                  }.each { cfg ->
                    println("Resolving ${p.path}:${cfg.name}")
                    cfg.incoming.artifactView { lenient(false) }.artifacts.artifactFiles.files
                  }
                }
              }
            }
          }
          GRADLE
          chmod +x ./gradlew
          ./gradlew --no-daemon --refresh-dependencies --write-verification-metadata sha256 -I "$RUNNER_TEMP/resolve-all.init.gradle" resolveAllForVerification
          test -s gradle/verification-metadata.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-gradle-verification-metadata
          path: gradle/verification-metadata.xml
          retention-days: 7
